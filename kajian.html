<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D9A441","options":["#D9A441","#E8B84F","#C98A2B"]},"$preview":{"width":1280,"height":3000}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const topic = s.topic ?? 'semua';
    const q = s.q ?? '';
    const sort = s.sort ?? 'pilihan';
    const TOPICS = [
      { id: 'semua', label: 'Semua', color: '#0E4F45' },
      { id: 'akidah', label: 'Akidah', color: '#0E4F45' },
      { id: 'fikih', label: 'Fikih', color: '#1E5A82' },
      { id: 'akhlak', label: 'Akhlak', color: '#8A5A14' },
      { id: 'tafsir', label: 'Tafsir', color: '#54407F' },
      { id: 'sirah', label: 'Sirah', color: '#8C3A3A' },
      { id: 'keluarga', label: 'Keluarga', color: '#9A3F66' }
    ];
    const ITEMS = [
      ['akidah', 'Mengenal Rukun Iman', 'Video'], ['akidah', 'Tauhid dalam Kehidupan Sehari-hari', 'Audio'], ['akidah', 'Menguatkan Iman di Tengah Kesibukan', 'Video'],
      ['fikih', 'Fikih Puasa Sunnah', 'Video'], ['fikih', 'Tata Cara Shalat Berjamaah', 'Video'], ['fikih', 'Zakat: Siapa yang Wajib Menunaikannya', 'Audio'],
      ['akhlak', 'Adab Menuntut Ilmu', 'Video'], ['akhlak', 'Menjaga Lisan di Media Sosial', 'Audio'], ['akhlak', 'Berbakti kepada Orang Tua', 'Video'],
      ['tafsir', 'Pelajaran dari Surah Al-Kahfi', 'Video'], ['tafsir', 'Memahami Ayat Kursi', 'Audio'], ['tafsir', 'Tadabbur Surah Al-Fatihah', 'Video'],
      ['sirah', 'Akhlak Nabi dalam Berdagang', 'Video'], ['sirah', 'Hijrah dan Pelajarannya', 'Audio'], ['sirah', 'Kesabaran Nabi dalam Berdakwah', 'Video'],
      ['keluarga', 'Membangun Rumah Tangga Sakinah', 'Video'], ['keluarga', 'Mendidik Anak dengan Keteladanan', 'Audio'], ['keluarga', 'Komunikasi Hangat Suami dan Istri', 'Video']
    ];
    const byId = {};
    TOPICS.forEach((t) => { byId[t.id] = t; });
    const needle = q.trim().toLowerCase();
    let list = ITEMS.filter(([tp, title]) => (topic === 'semua' || tp === topic) && (needle === '' || title.toLowerCase().indexOf(needle) !== -1));
    if (sort === 'az') {
      list = list.slice().sort((a, b) => a[1].localeCompare(b[1], 'id'));
    }
    const base = 'min-height:46px;padding:0 22px;border-radius:999px;font-size:15px;font-weight:700;';
    const tabs = TOPICS.map((t) => ({
      label: t.label,
      on: t.id === topic,
      pick: () => this.setState({ topic: t.id }),
      style: t.id === topic
        ? base + 'background:#0E4F45;color:#fff;border:1.5px solid #0E4F45'
        : base + 'background:#fff;color:#10231F;border:1.5px solid #C5D2CC'
    }));
    const cards = list.map(([tp, title, format]) => ({
      title,
      format,
      topicLabel: byId[tp].label,
      thumbStyle: 'position:relative;overflow:hidden;height:130px;background:' + byId[tp].color,
      glyph: '#g-' + tp
    }));
    return {
      accent: this.props.accent ?? '#D9A441',
      q,
      onQ: (e) => this.setState({ q: e.target.value }),
      toggleSort: () => this.setState({ sort: sort === 'az' ? 'pilihan' : 'az' }),
      sortLabel: sort === 'az' ? 'Urutan: A–Z' : 'Urutan: Pilihan editor',
      tabs,
      cards,
      empty: list.length === 0,
      countLabel: list.length + ' kajian ditemukan',
      reset: () => this.setState({ topic: 'semua', q: '' })
    };
  }
}
</script>
