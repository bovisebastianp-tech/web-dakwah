<button aria-pressed="{{a.on}}" onClick="{{a.pick}}" style="{{a.style}}">{{a.label}}</button>
</sc-for>
</div>

<sc-if value="{{isCustom}}" hint-placeholder-val="{{false}}">
<div style="margin-bottom:16px">
<label for="nominal" style="display:block;margin-bottom:8px;font-size:15px;font-weight:700">Nominal lain (Rp)</label>
<input id="nominal" type="text" inputmode="numeric" placeholder="Contoh: 75000" value="{{custom}}" onChange="{{onCustom}}" style="box-sizing:border-box;width:100%;height:52px;padding:0 16px;border-radius:14px;border:1.5px solid #B7C8C1;background:#fff;font-family:inherit;font-size:16px;color:#10231F">

<label style="display:flex;align-items:center;gap:12px;min-height:44px;margin-top:6px;font-size:15px;color:#2B3F39;cursor:pointer">
<input type="checkbox" checked="{{hide}}" onChange="{{toggleHide}}" style="width:22px;height:22px;accent-color:#0E4F45">
Tampilkan sebagai Hamba Allah
</label>
</div>

<p style="margin:0 0 12px;font-size:15px;font-weight:700">Metode pembayaran</p>

<button aria-pressed="{{m.on}}" onClick="{{m.pick}}" style="{{m.style}}">{{m.label}}</button>

<div style="display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;padding:18px 20px;border-radius:16px;background:#F6F7F4;margin-bottom:12px">

<button onClick="{{submit}}" style="width:100%;min-height:56px;border-radius:14px;border:none;background:#0E4F45;color:#fff;font-size:17px;font-weight:800">Lanjutkan donasi</button>

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D9A441","options":["#D9A441","#E8B84F","#C98A2B"]},"$preview":{"width":1280,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const freq = s.freq ?? 'sekali';
    const amt = s.amt ?? 50000;
    const custom = s.custom ?? '';
    const method = s.method ?? 'qris';
    const name = s.name ?? '';
    const hide = s.hide ?? false;
    const done = s.done ?? false;
    const hint = s.hint ?? '';

    const rp = (n) => 'Rp' + n.toLocaleString('id-ID');
    const isCustom = amt === 'lain';
    const customValue = parseInt(custom.replace(/\D/g, ''), 10) || 0;
    const total = isCustom ? customValue : amt;
    const freqText = freq === 'bulanan' ? ' / bulan' : '';

    const segBase = 'flex:1;min-height:48px;border-radius:12px;border:none;font-size:15px;font-weight:700;';
    const freqs = [['sekali', 'Sekali saja'], ['bulanan', 'Setiap bulan']].map(([id, label]) => ({
      label,
      on: id === freq,
      pick: () => this.setState({ freq: id }),
      style: id === freq
        ? segBase + 'background:#0E4F45;color:#fff'
        : segBase + 'background:transparent;color:#0E4F45'
    }));

    const chip = 'min-height:48px;padding:0 20px;border-radius:12px;font-size:15px;font-weight:700;';
    const chipOn = 'background:#E4EFEA;color:#0E4F45;border:2px solid #0E4F45';
    const chipOff = 'background:#fff;color:#10231F;border:1.5px solid #C5D2CC';
    const amounts = [25000, 50000, 100000, 250000, 'lain'].map((v) => ({
      label: v === 'lain' ? 'Lainnya' : rp(v),
      on: v === amt,
      pick: () => this.setState({ amt: v, hint: '' }),
      style: chip + (v === amt ? chipOn : chipOff)
    }));

    const METHODS = [['transfer', 'Transfer bank'], ['qris', 'QRIS'], ['dompet', 'Dompet digital']];
    const methods = METHODS.map(([id, label]) => ({
      label,
      on: id === method,
      pick: () => this.setState({ method: id }),
      style: chip + (id === method ? chipOn : chipOff)
    }));
    const methodLabel = METHODS.find((m) => m[0] === method)[1];
    const displayName = hide || name.trim() === '' ? 'Hamba Allah' : name.trim();

    return {
      accent: this.props.accent ?? '#D9A441',
      showForm: !done,
      showDone: done,
      freqs,
      amounts,
      isCustom,
      custom,
      onCustom: (e) => this.setState({ custom: e.target.value, hint: '' }),
      name,
      onName: (e) => this.setState({ name: e.target.value }),
      hide,
      toggleHide: () => this.setState({ hide: !hide }),
      methods,
      totalLabel: rp(total) + freqText,
      hint,
      submit: () => {
        if (total < 10000) {
          this.setState({ hint: 'Donasi minimal Rp10.000.' });
        } else {
          this.setState({ done: true, hint: '' });
        }
      },
      displayName,
      recap: rp(total) + freqText + ' lewat ' + methodLabel + '.',
      reset: () => this.setState({ done: false, amt: 50000, custom: '', name: '', hide: false, freq: 'sekali', method: 'qris', hint: '' })
    };
  }
}
</script>
