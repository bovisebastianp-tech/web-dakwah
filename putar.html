    const pos = s.pos ?? 0;
    const speed = s.speed ?? 1;
    const follow = s.follow ?? false;
    const saved = s.saved ?? false;
    const copied = s.copied ?? false;
    const tab = s.tab ?? 'ringkasan';
    const draft = s.draft ?? '';
    const notes = s.notes ?? [];

    const speedBase = 'min-height:44px;min-width:56px;padding:0 12px;border-radius:12px;font-size:14px;font-weight:700;';
    const speeds = [1, 1.25, 1.5].map((v) => ({
      label: v + '×',
      on: v === speed,
      pick: () => this.setState({ speed: v }),
      style: v === speed
        ? speedBase + 'background:#E4EFEA;color:#0E4F45;border:1.5px solid #0E4F45'
        : speedBase + 'background:#fff;color:#10231F;border:1.5px solid #C5D2CC'
    }));

    const tabBase = 'min-height:48px;padding:0 20px;margin-bottom:-1px;background:transparent;border:none;font-size:16px;font-weight:700;';
    const TABS = [['ringkasan', 'Ringkasan'], ['poin', 'Poin penting'], ['catatan', 'Catatanku']];
    const tabs = TABS.map(([id, label]) => ({
      label,
      on: id === tab,
      pick: () => this.setState({ tab: id }),
      style: id === tab
        ? tabBase + 'color:#0E4F45;border-bottom:3px solid #0E4F45'
        : tabBase + 'color:#4B5F59;border-bottom:3px solid transparent'
    }));

    const pill = 'min-height:46px;padding:0 20px;border-radius:12px;font-size:15px;font-weight:700;';
    const on = 'background:#E4EFEA;color:#0E4F45;border:1.5px solid #0E4F45';
    const off = 'background:#fff;color:#10231F;border:1.5px solid #C5D2CC';

    return {
      accent: this.props.accent ?? '#D9A441',
      playing,
      paused: !playing,
      playLabel: playing ? 'Jeda' : 'Putar',
      togglePlay: () => this.setState({ playing: !playing }),
      back: () => this.setState({ pos: Math.max(0, pos - 5) }),
      fwd: () => this.setState({ pos: Math.min(100, pos + 5) }),
      pos,
      posLabel: 'Posisi ' + pos + '%',
      barStyle: 'height:100%;border-radius:999px;background:#0E4F45;width:' + pos + '%',
      speeds,
      speedLabel: speed + '×',
      follow,
      toggleFollow: () => this.setState({ follow: !follow }),
      followLabel: follow ? 'Diikuti' : 'Ikuti',
      followStyle: pill + (follow ? on : 'background:#0E4F45;color:#fff;border:1.5px solid #0E4F45'),
      saved,
      toggleSaved: () => this.setState({ saved: !saved }),
      savedLabel: saved ? 'Tersimpan' : 'Simpan',
      savedStyle: pill + (saved ? on : off),
      share: () => this.setState({ copied: !copied }),
      shareLabel: copied ? 'Tautan disalin' : 'Bagikan',
      tabs,
      showRingkasan: tab === 'ringkasan',
      showPoin: tab === 'poin',
      showCatatan: tab === 'catatan',
      draft,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      addNote: () => {
        const text = draft.trim();
        if (text === '') return;
        this.setState({ notes: [{ id: Date.now(), text }].concat(notes), draft: '' });
      },
      noNotes: notes.length === 0,
      notes: notes.map((n) => ({
        text: n.text,
        remove: () => this.setState({ notes: notes.filter((x) => x.id !== n.id) })
      }))
    };
  }
}
</script>
</body>
</html>
