<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D9A441","options":["#D9A441","#E8B84F","#C98A2B"]},"$preview":{"width":1280,"height":3000}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const topic = s.topic ?? 'akidah';
    const remind = s.remind ?? false;
    const TOPICS = [
      { id: 'akidah', label: 'Akidah', color: '#0E4F45' },
      { id: 'fikih', label: 'Fikih', color: '#1E5A82' },
      { id: 'akhlak', label: 'Akhlak', color: '#8A5A14' },
      { id: 'tafsir', label: 'Tafsir', color: '#54407F' },
      { id: 'sirah', label: 'Sirah', color: '#8C3A3A' },
      { id: 'keluarga', label: 'Keluarga', color: '#9A3F66' }
    ];
    const ITEMS = {
      akidah: [['Mengenal Rukun Iman', 'Video'], ['Tauhid dalam Kehidupan Sehari-hari', 'Audio'], ['Menguatkan Iman di Tengah Kesibukan', 'Video']],
      fikih: [['Fikih Puasa Sunnah', 'Video'], ['Tata Cara Shalat Berjamaah', 'Video'], ['Zakat: Siapa yang Wajib Menunaikannya', 'Audio']],
      akhlak: [['Adab Menuntut Ilmu', 'Video'], ['Menjaga Lisan di Media Sosial', 'Audio'], ['Berbakti kepada Orang Tua', 'Video']],
      tafsir: [['Pelajaran dari Surah Al-Kahfi', 'Video'], ['Memahami Ayat Kursi', 'Audio'], ['Tadabbur Surah Al-Fatihah', 'Video']],
      sirah: [['Akhlak Nabi dalam Berdagang', 'Video'], ['Hijrah dan Pelajarannya', 'Audio'], ['Kesabaran Nabi dalam Berdakwah', 'Video']],
      keluarga: [['Membangun Rumah Tangga Sakinah', 'Video'], ['Mendidik Anak dengan Keteladanan', 'Audio'], ['Komunikasi Hangat Suami dan Istri', 'Video']]
    };
    const base = 'min-height:46px;padding:0 22px;border-radius:999px;font-size:15px;font-weight:700;';
    const topics = TOPICS.map((t) => ({
      label: t.label,
      on: t.id === topic,
      pick: () => this.setState({ topic: t.id }),
      style: t.id === topic
        ? base + 'background:#0E4F45;color:#fff;border:1.5px solid #0E4F45'
        : base + 'background:#fff;color:#10231F;border:1.5px solid #C5D2CC'
    }));
    const cur = TOPICS.find((t) => t.id === topic);
    const cards = ITEMS[topic].map(([title, format]) => ({
      title,
      format,
      thumbStyle: 'position:relative;overflow:hidden;height:150px;background:' + cur.color,
      glyph: '#g-' + topic
    }));
    return {
      accent: this.props.accent ?? '#D9A441',
      topics,
      cards,
      remind,
      toggleRemind: () => this.setState({ remind: !remind }),
      remindLabel: remind ? 'Pengingat aktif' : 'Ingatkan saya',
      remindStyle: 'flex:1 1 140px;min-height:48px;padding:0 18px;border-radius:12px;font-weight:700;font-size:15px;' + (remind
        ? 'background:#E4EFEA;color:#0E4F45;border:1.5px solid #0E4F45'
        : 'background:#fff;color:#10231F;border:1.5px solid #C5D2CC')
    };
  }
}
