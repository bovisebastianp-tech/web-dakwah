<div class="band-in" style="position:relative;max-width:1200px;margin:0 auto;padding:64px 24px 56px">

<section style="max-width:1200px;margin:0 auto;padding:36px 24px 0">

</sc-for>
</div>
</section>

<section style="max-width:1200px;margin:0 auto;padding:32px 24px 72px">
<sc-for list="{{featured}}" as="f" hint-placeholder-count="1">
<article style="display:flex;flex-wrap:wrap;background:#fff;border:1px solid #D8E1DD;border-radius:24px;overflow:hidden;margin-bottom:24px">
<div style="{{f.tileStyle}}">
<svg viewBox="0 0 300 150" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="position:absolute;left:0;top:0;width:100%;height:100%"><use href="{{f.glyph}}" width="300" height="150"/></svg>
</div>
<div class="fp" style="flex:1 1 360px;min-width:0;padding:40px">
<span style="padding:4px 12px;border-radius:999px;background:#E4EFEA;color:#0E4F45;font-size:13px;font-weight:700">{{f.cat}}</span>
<h2 class="h2" style="margin:16px 0 12px;font-size:32px;line-height:1.2;letter-spacing:-.01em;font-weight:800">{{f.title}}</h2>
<p style="margin:0 0 20px;font-size:17px;line-height:1.65;color:#3D524C">{{f.excerpt}}</p>
<p style="margin:0 0 22px;font-size:14px;color:#4B5F59">Oleh [Nama Penulis]</p>
<button aria-pressed="{{f.saved}}" onClick="{{f.toggle}}" style="{{f.saveStyle}}">{{f.saveLabel}}</button>
</div>
</article>
</sc-for>

<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(420px,100%),1fr));gap:24px">
<sc-for list="{{rest}}" as="a" hint-placeholder-count="4">
<article style="min-width:0;background:#fff;border:1px solid #D8E1DD;border-radius:20px;overflow:hidden">
<div style="{{a.tileStyle}}"><svg viewBox="0 0 300 150" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="position:absolute;left:0;top:0;width:100%;height:100%"><use href="{{a.glyph}}" width="300" height="150"/></svg></div>
<div style="padding:22px 26px 26px">
<span style="font-size:13px;font-weight:700;color:#0E4F45;letter-spacing:.04em">{{a.catUpper}}</span>
<h3 style="margin:8px 0 10px;font-size:21px;line-height:1.3;font-weight:800">{{a.title}}</h3>
<p style="margin:0 0 18px;font-size:15px;line-height:1.6;color:#4B5F59">{{a.excerpt}}</p>
<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px">
<span style="font-size:14px;color:#4B5F59">Oleh [Nama Penulis]</span>
<button aria-pressed="{{a.saved}}" onClick="{{a.toggle}}" style="{{a.saveStyle}}">{{a.saveLabel}}</button>
</div>
</div>
</article>
</sc-for>
</div>
</section>

<section style="background:#0E4F45">
<div class="nl" style="max-width:1200px;margin:0 auto;padding:72px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:32px">
<div style="flex:1 1 360px;min-width:0">
<h2 class="h2" style="margin:0 0 12px;font-size:34px;line-height:1.2;letter-spacing:-.02em;font-weight:800;color:#fff">Artikel baru, langsung ke emailmu</h2>
<p style="margin:0;max-width:480px;font-size:17px;line-height:1.6;color:#CFE3DC">Satu tulisan ringan setiap pekan. Berhenti berlangganan kapan saja.</p>
</div>
<div style="flex:1 1 380px;min-width:0;max-width:520px">
<label for="surel" style="display:block;margin-bottom:8px;font-size:15px;font-weight:700;color:#fff">Alamat email</label>
<div style="display:flex;flex-wrap:wrap;gap:12px">
<input id="surel" type="email" placeholder="nama@email.com" value="{{email}}" onChange="{{onEmail}}" style="box-sizing:border-box;flex:1 1 240px;min-width:0;height:54px;padding:0 18px;border-radius:14px;border:none;background:#fff;font-family:inherit;font-size:16px;color:#10231F">
<button onClick="{{subscribe}}" style="min-height:54px;padding:0 26px;border-radius:14px;border:none;background:{{accent}};color:#10231F;font-size:16px;font-weight:800">Berlangganan</button>
</div>
<p aria-live="polite" style="margin:12px 0 0;min-height:24px;font-size:15px;color:#fff">{{message}}</p>
</div>
</div>
</section>

<rect x="140" y="40" width="80" height="20"/><path d="M164 40C164 28 174 26 180 16C186 26 196 28 196 40Z"/><path d="M135 22L140 6L145 22Z"/><rect x="136" y="22" width="8" height="38"/><path d="M215 22L220 6L225 22Z"/><rect x="216" y="22" width="8" height="38"/>
<rect x="640" y="36" width="160" height="24"/><path d="M690 36C690 22 706 18 720 4C734 18 750 22 750 36Z"/><path d="M634 18L640 0L646 18Z"/><rect x="636" y="18" width="8" height="42"/><path d="M794 18L800 0L806 18Z"/><rect x="796" y="18" width="8" height="42"/>
<rect x="1220" y="40" width="80" height="20"/><path d="M1244 40C1244 28 1254 26 1260 16C1266 26 1276 28 1276 40Z"/><path d="M1215 22L1220 6L1225 22Z"/><rect x="1216" y="22" width="8" height="38"/><path d="M1295 22L1300 6L1305 22Z"/><rect x="1296" y="22" width="8" height="38"/>
<rect x="380" y="48" width="80" height="12"/><path d="M408 48C408 40 414 38 420 30C426 38 432 40 432 48Z"/><rect x="980" y="48" width="80" height="12"/><path d="M1008 48C1008 40 1014 38 1020 30C1026 38 1032 40 1032 48Z"/></g></svg>
<div style="max-width:1200px;margin:0 auto;padding:56px 24px 28px;display:flex;flex-wrap:wrap;gap:40px;justify-content:space-between">

</div>
<div style="max-width:1200px;margin:0 auto;padding:20px 24px 32px;border-top:1px solid #1F5A50;font-size:14px">© 2026 Cahaya Dakwah. Seluruh hak cipta dilindungi.</div>

</template>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D9A441","options":["#D9A441","#E8B84F","#C98A2B"]},"$preview":{"width":1280,"height":2700}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const cat = s.cat ?? 'Semua';
    const saved = s.saved ?? {};
    const email = s.email ?? '';
    const message = s.message ?? '';
    const COLORS = { Akhlak: '#1E5A82', Renungan: '#8A5A14', Ibadah: '#0E4F45', Keluarga: '#9A3F66', Wawasan: '#54407F' };
    const GLYPHS = { Akhlak: '#g-akhlak', Renungan: '#g-akidah', Ibadah: '#g-tafsir', Keluarga: '#g-keluarga', Wawasan: '#g-fikih' };
    const ARTICLES = [
      { id: 1, cat: 'Akhlak', title: 'Lima Adab Bermedia Sosial bagi Seorang Muslim', excerpt: 'Sebelum menekan tombol bagikan, ada beberapa hal yang layak kita timbang.' },
      { id: 2, cat: 'Renungan', title: 'Menata Niat Sebelum Memulai Hari', excerpt: 'Hari yang sama terasa berbeda ketika kita tahu untuk apa kita melangkah.' },
      { id: 3, cat: 'Ibadah', title: 'Cara Mudah Membiasakan Membaca Al-Qur’an Setiap Hari', excerpt: 'Mulai dari porsi kecil yang konsisten, lalu tambah pelan-pelan.' },
      { id: 4, cat: 'Keluarga', title: 'Mengajarkan Shalat kepada Anak dengan Cara yang Menyenangkan', excerpt: 'Anak belajar dari contoh dan suasana di rumah, bukan dari tekanan.' },
      { id: 5, cat: 'Renungan', title: 'Sabar dan Syukur: Dua Sayap Seorang Mukmin', excerpt: 'Dua sikap yang tampak berbeda, tetapi saling menopang dalam keseharian.' },
      { id: 6, cat: 'Wawasan', title: 'Membedakan Kabar Benar dan Hoaks Sebelum Membagikan', excerpt: 'Tabayyun adalah kebiasaan yang bisa dilatih, dimulai dari jeda sejenak.' }
    ];
    const list = ARTICLES.filter((a) => cat === 'Semua' || a.cat === cat);

    const chipBase = 'min-height:46px;padding:0 22px;border-radius:999px;font-size:15px;font-weight:700;';
    const tabs = ['Semua', 'Akhlak', 'Renungan', 'Ibadah', 'Keluarga', 'Wawasan'].map((label) => ({
      label,
      on: label === cat,
      pick: () => this.setState({ cat: label }),
      style: label === cat
        ? chipBase + 'background:#0E4F45;color:#fff;border:1.5px solid #0E4F45'
        : chipBase + 'background:#fff;color:#10231F;border:1.5px solid #C5D2CC'
    }));

    const saveBase = 'min-height:44px;padding:0 18px;border-radius:12px;font-size:14px;font-weight:700;';
    const decorate = (a, tileStyle) => {
      const isSaved = !!saved[a.id];
      return {
        title: a.title,
        excerpt: a.excerpt,
        cat: a.cat,
        catUpper: a.cat.toUpperCase(),
        glyph: GLYPHS[a.cat],
        tileStyle,
        saved: isSaved,
        saveLabel: isSaved ? 'Tersimpan' : 'Simpan bacaan',
        saveStyle: saveBase + (isSaved
          ? 'background:#E4EFEA;color:#0E4F45;border:1.5px solid #0E4F45'
          : 'background:#fff;color:#10231F;border:1.5px solid #C5D2CC'),
        toggle: () => {
          const next = Object.assign({}, saved);
          next[a.id] = !isSaved;
          this.setState({ saved: next });
        }
      };
    };

    const featured = list.slice(0, 1).map((a) => decorate(a, 'position:relative;overflow:hidden;flex:1 1 320px;min-height:300px;background:' + COLORS[a.cat]));
    const rest = list.slice(1).map((a) => decorate(a, 'position:relative;overflow:hidden;height:140px;background:' + COLORS[a.cat]));

    return {
      accent: this.props.accent ?? '#D9A441',
      tabs,
      featured,
      rest,
      email,
      onEmail: (e) => this.setState({ email: e.target.value }),
      subscribe: () => {
        const ok = email.indexOf('@') > 0 && email.indexOf('.', email.indexOf('@')) > 0;
        this.setState({ message: ok ? 'Terima kasih, artikel baru akan dikirim ke emailmu.' : 'Masukkan alamat email yang valid.' });
      },
      message
    };
  }
}
</script>
